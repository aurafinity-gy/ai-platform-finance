[project]
name = "finance-application"
version = "0.1.0"
description = "Finance use cases and application-owned ports."
requires-python = ">=3.13,<3.14"
dependencies = ["finance-domain"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_application"]

[tool.uv.sources]
finance-domain = { workspace = true }

[tool.platform]
layer = "application"
visibility = "public"

