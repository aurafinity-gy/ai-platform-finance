[project]
name = "finance-agents"
version = "0.1.0"
description = "Finance-specific agent definitions and prompts."
requires-python = ">=3.13,<3.14"
dependencies = ["finance-application", "finance-domain"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agents"]

[tool.uv.sources]
finance-application = { workspace = true }
finance-domain = { workspace = true }

[tool.platform]
layer = "application"
visibility = "private"

