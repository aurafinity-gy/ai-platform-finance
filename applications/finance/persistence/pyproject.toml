[project]
name = "finance-persistence"
version = "0.1.0"
description = "PostgreSQL adapter for the Finance application."
requires-python = ">=3.13,<3.14"
dependencies = [
  "finance-application",
  "finance-domain",
  "psycopg[binary,pool]==3.2.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_persistence"]

[tool.uv.sources]
finance-application = { workspace = true }
finance-domain = { workspace = true }

[tool.platform]
layer = "adapter"
visibility = "private"

