[project]
name = "finance-api"
version = "0.1.0"
description = "FastAPI transport adapter for Finance capabilities."
requires-python = ">=3.13,<3.14"
dependencies = [
  "finance-application",
  "finance-domain",
  "fastapi==0.141.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api"]

[tool.uv.sources]
finance-application = { workspace = true }
finance-domain = { workspace = true }

[tool.platform]
layer = "adapter"
visibility = "public"

