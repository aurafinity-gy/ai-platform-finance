[project]
name = "finance-domain"
version = "0.1.0"
description = "Framework-neutral Finance domain model."
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_domain"]

[tool.platform]
layer = "domain"
visibility = "public"

