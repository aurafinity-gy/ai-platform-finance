[project]
name = "finance-api-fastapi"
version = "0.1.0"
description = "Finance API executable composition root."
requires-python = ">=3.13,<3.14"
dependencies = [
  "finance-api",
  "finance-application",
  "finance-persistence",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.9",
  "pyjwt[crypto]==2.13.0",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
finance-api = "finance_api_service.main:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api_service"]

[tool.uv.sources]
finance-api = { workspace = true }
finance-application = { workspace = true }
finance-persistence = { workspace = true }

[tool.platform]
layer = "composition-root"
visibility = "private"

